name: SwiftStockfish — CI (macOS prebuilt XCFramework)

# Trusted macOS coverage: the prebuilt-XCFramework path with the live engine on
# an Intel Mac. Its trigger surface stays limited to default-branch pushes and
# manual dispatches, and pull requests belong in `ci.yml`. That limit predates
# the move to GitHub-hosted runners and is kept so that moving this job back to
# a persistent self-hosted machine stays a one-line `runs-on` change.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: trusted-macos-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No DEVELOPER_DIR here: Tools/verify-macos-build-host.sh selects Xcode 26.x
# for the runner it lands on and exports it to every later step.

jobs:
  macos-intel:
    name: SwiftStockfish — prebuilt-XCFramework tests (Intel macOS, live engine)
    # GitHub-hosted Intel image with Xcode 26.x; see release.yml for the
    # reasoning. To move back to the self-hosted Mac, change only this line to
    # `[self-hosted, macOS, X64]`.
    runs-on: macos-26-intel
    # 30 was right when the framework was committed and this job only built
    # and tested. It now builds all ten slices first: about 25 minutes on the
    # self-hosted Mac Pro, so roughly three times that on a 4-vCPU
    # hosted Intel runner.
    timeout-minutes: 120
    steps:
      - name: Checkout SwiftStockfish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The runner account owns its workspace (hosted or self-hosted);
          # skip adding a global safe-directory exception it does not need.
          set-safe-directory: false
          persist-credentials: false
      - name: Select Xcode 26 and verify toolchain and CPU capabilities
        run: Tools/verify-macos-build-host.sh
      # main is PATH MODE: the binaryTarget points at Frameworks/Stockfish.xcframework,
      # and since "Stop committing the xcframework" that file is gitignored and
      # absent from a fresh checkout. Without this step `swift build` fails at
      # manifest load with "local binary target 'StockfishEngine' ... does not
      # contain a binary artifact" — which is what happened on every run of this
      # job from that commit onward. Consumers never need it: they pin a version
      # and SwiftPM fetches the release asset from the URL-mode manifest.
      - name: Build the XCFramework this checkout does not carry
        run: Tools/build-xcframework.sh
      - name: Build prebuilt-XCFramework package path
        run: swift build
      - name: Test prebuilt-XCFramework path with live engine
        # The live suite shares one serialized, versioned NNUE fixture. A
        # fresh hosted runner downloads it (about 94 MB) every run; the loader
        # verifies its full pinned SHA-256 before use. Keeping it under
        # RUNNER_TEMP keeps it inside the job's own scratch space on any runner.
        env:
          SWIFTSTOCKFISH_INTEGRATION: '1'
          SWIFTSTOCKFISH_NNUE_CACHE: ${{ runner.temp }}/swiftstockfish-nnue
        run: swift test
