name: SwiftStockfish — CI (macOS binary arm)

# This workflow executes repository code on a persistent self-hosted machine.
# Keep its trigger surface limited to trusted default-branch pushes and manual
# dispatches; pull requests belong in the GitHub-hosted `ci.yml` workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: trusted-macos-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  macos-self-hosted:
    name: SwiftStockfish — binary-arm tests (macOS, Intel self-hosted)
    # Public-visibility prerequisite: restrict the organization runner group to
    # fianchettochess/SwiftStockfish/.github/workflows/ci-macos-trusted.yml@refs/heads/main.
    # These generic labels route jobs; they are not an authorization boundary.
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The trusted runner owns its workspace; avoid copying its account's
          # global .gitconfig into the Actions log for safe-directory setup.
          set-safe-directory: false
          persist-credentials: false
      - name: Verify self-hosted toolchain and CPU capabilities
        run: Tools/verify-self-hosted-macos.sh
      - name: swift build
        run: swift build
      - name: swift test — including live engine integration
        # The live suite shares one serialized, versioned NNUE fixture and
        # reuses valid cached downloads across trusted runs on this machine.
        env:
          SWIFTSTOCKFISH_INTEGRATION: '1'
        run: swift test
