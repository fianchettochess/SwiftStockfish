name: SwiftStockfish — CI (macOS prebuilt XCFramework)

# This workflow executes repository code on a persistent self-hosted machine.
# Keep its trigger surface limited to trusted default-branch pushes and manual
# dispatches; pull requests belong in the GitHub-hosted `ci.yml` workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: trusted-macos-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  macos-self-hosted:
    name: SwiftStockfish — prebuilt-XCFramework tests (Intel self-hosted macOS, live engine)
    # Public-visibility prerequisite: restrict the organization runner group to
    # fianchettochess/SwiftStockfish/.github/workflows/ci-macos-trusted.yml@refs/heads/main.
    # These generic labels route jobs; they are not an authorization boundary.
    runs-on: [self-hosted, macOS, X64]
    # 30 was right when the framework was committed and this job only built
    # and tested. It now builds all ten slices first; the release job, which
    # does that plus both test arms and the upload, takes about 17 minutes.
    timeout-minutes: 60
    steps:
      - name: Checkout SwiftStockfish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The trusted runner owns its workspace; avoid copying its account's
          # global .gitconfig into the Actions log for safe-directory setup.
          set-safe-directory: false
          persist-credentials: false
      - name: Verify self-hosted toolchain and CPU capabilities
        run: Tools/verify-self-hosted-macos.sh
      # main is PATH MODE: the binaryTarget points at Frameworks/Stockfish.xcframework,
      # and since "Stop committing the xcframework" that file is gitignored and
      # absent from a fresh checkout. Without this step `swift build` fails at
      # manifest load with "local binary target 'StockfishEngine' ... does not
      # contain a binary artifact" — which is what happened on every run of this
      # job from that commit onward. Consumers never need it: they pin a version
      # and SwiftPM fetches the release asset from the URL-mode manifest.
      - name: Build the XCFramework this checkout does not carry
        run: Tools/build-xcframework.sh
      - name: Build prebuilt-XCFramework package path
        run: swift build
      - name: Test prebuilt-XCFramework path with live engine
        # The live suite shares one serialized, versioned NNUE fixture and
        # reuses valid cached downloads across trusted runs on this machine.
        env:
          SWIFTSTOCKFISH_INTEGRATION: '1'
        run: swift test
