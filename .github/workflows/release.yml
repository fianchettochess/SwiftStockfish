name: SwiftStockfish — Release XCFramework
run-name: SwiftStockfish XCFramework release · ${{ inputs.version }}

# Releases are deliberately manual. The workflow starts from the current
# default-branch commit, rebuilds and tests the exact XCFramework, creates the
# URL-based manifest commit, then creates one stable semver tag through a
# draft release. It never force-moves a tag and never mutates `main`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release version / tag (for example 19.0.1)'
        required: true
        type: string
      source_ref:
        description: >-
          Existing TAG to build from, for backfilling a release onto a line the
          default branch has moved past (for example 18.0.17). Leave empty to
          build the default branch, which is the normal case.
        required: false
        default: ''
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}
  ASSET: Stockfish.xcframework.zip
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  release:
    name: SwiftStockfish — build/publish XCFramework release
    # Manual dispatch checks out only the current default-branch head, so fork
    # pull requests never execute code on this persistent release machine.
    # Public-visibility prerequisite: restrict the organization runner group to
    # fianchettochess/SwiftStockfish/.github/workflows/release.yml@refs/heads/main.
    # These generic labels route jobs; they are not an authorization boundary.
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 120
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty resolves to the default branch, which is the normal release.
          # A tag builds THAT line instead — see the source-revision guard.
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          # The runner account owns its workspace; avoid importing its global
          # Git configuration solely to add a safe-directory exception.
          set-safe-directory: false
          persist-credentials: false

      - name: Validate version, source revision, and collisions
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_REF: ${{ inputs.source_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "${GH_TOKEN}" | \
            base64 | tr -d '\r\n')"
          echo "::add-mask::${AUTH_HEADER}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_HEADER}"
          export GIT_TERMINAL_PROMPT=0
          unset AUTH_HEADER

          if ! printf '%s' "${VERSION}" | \
            grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::invalid version '${VERSION}' — expected stable N.N.N"
            exit 1
          fi
          UPSTREAM="$(tr -d '\r\n' < .upstream-version)"
          ENGINE_LINE="${UPSTREAM#sf_}"
          IFS='.' read -r ENGINE_MAJOR ENGINE_MINOR _ <<< "${ENGINE_LINE}"
          ENGINE_MINOR="${ENGINE_MINOR:-0}"
          if ! printf '%s' "${VERSION}" | \
            grep -Eq "^${ENGINE_MAJOR}\\.${ENGINE_MINOR}\\.[0-9]+$"; then
            echo "::error::version '${VERSION}' must stay on the ${ENGINE_MAJOR}.${ENGINE_MINOR}.x wrapper line for upstream ${UPSTREAM}"
            exit 1
          fi
          git check-ref-format "refs/tags/${VERSION}"
          git fetch --no-tags origin "${DEFAULT_BRANCH}"
          # TWO SOURCES, BOTH REVIEWED. Normally the release must be the current
          # default-branch head — that is the guard against releasing a stale or
          # unreviewed tree, and it is unchanged.
          #
          # A BACKFILL builds an existing TAG instead, which is how a line the
          # default branch has moved past can still get a release. 18.0.14
          # through 18.0.17 carried real fixes (a vendored SHA-256 replacing
          # swift-crypto, dropping swift-docc-plugin, a CryptoKit shadowing fix)
          # and never got one, so the only way to consume them was to know the
          # tag by name. The source must be a tag that already exists on origin,
          # so this still cannot publish an arbitrary commit; and the engine-line
          # check above reads `.upstream-version` from the CHECKED-OUT tree, so a
          # backfill is automatically held to its own engine's version line.
          # (release backfill 2026-09-07)
          if [ -z "${SOURCE_REF}" ]; then
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${DEFAULT_BRANCH}")" ]; then
              echo "::error::dispatch this workflow from the current ${DEFAULT_BRANCH} head"
              exit 1
            fi
          else
            if ! git ls-remote --exit-code --tags origin \
              "refs/tags/${SOURCE_REF}" >/dev/null; then
              echo "::error::source_ref '${SOURCE_REF}' is not an existing tag on origin"
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "${SOURCE_REF}^{commit}")" ]; then
              echo "::error::checkout is not at '${SOURCE_REF}'"
              exit 1
            fi
            echo "note: backfilling ${VERSION} from tag ${SOURCE_REF}"
          fi
          assert_tag_absent() {
            local status
            if git ls-remote --exit-code --tags origin \
              "refs/tags/${VERSION}" >/dev/null; then
              echo "::error::tag '${VERSION}' already exists; release tags are never re-cut"
              return 1
            else
              status=$?
              if [ "${status}" -ne 2 ]; then
                echo "::error::could not verify that tag '${VERSION}' is unused"
                return "${status}"
              fi
            fi
          }
          assert_tag_absent
          RELEASE_TAGS="$(gh release list --limit 10000 --json tagName \
            --jq '.[].tagName')"
          if printf '%s\n' "${RELEASE_TAGS}" | grep -qxF "${VERSION}"; then
            echo "::error::release '${VERSION}' already exists"
            exit 1
          fi

      - name: Verify self-hosted toolchain and CPU capabilities
        run: Tools/verify-self-hosted-macos.sh

      - name: Verify source-engine SIMD configuration
        run: Tools/verify-simd-config.sh

      - name: Test source delivery path — including live engine integration
        env:
          SWIFTSTOCKFISH_FORCE_SOURCE_ENGINE: '1'
          SWIFTSTOCKFISH_INTEGRATION: '1'
        run: swift test --scratch-path "${RUNNER_TEMP}/swiftstockfish-release-source"

      - name: Build exact XCFramework
        run: |
          chmod +x Tools/build-xcframework.sh
          ./Tools/build-xcframework.sh

      - name: Validate architecture, deployment, and optimized Intel slices
        run: |
          set -euo pipefail
          XCF='Frameworks/Stockfish.xcframework'
          WATCH="${XCF}/watchos-arm64_arm64_32/libStockfish-watchos.a"
          MAC="${XCF}/macos-arm64_x86_64/libStockfish-macosx.a"
          plutil -lint "${XCF}/Info.plist"
          lipo "${XCF}/ios-arm64/libStockfish-iphoneos-arm64.a" -verify_arch arm64
          lipo \
            "${XCF}/ios-arm64_x86_64-simulator/libStockfish-iphonesimulator.a" \
            -verify_arch arm64 x86_64
          lipo \
            "${XCF}/ios-arm64_x86_64-maccatalyst/libStockfish-maccatalyst.a" \
            -verify_arch arm64 x86_64
          lipo "${XCF}/tvos-arm64/libStockfish-appletvos-arm64.a" -verify_arch arm64
          lipo \
            "${XCF}/tvos-arm64_x86_64-simulator/libStockfish-appletvsimulator.a" \
            -verify_arch arm64 x86_64
          lipo "${WATCH}" -verify_arch arm64_32 arm64
          lipo \
            "${XCF}/watchos-arm64_x86_64-simulator/libStockfish-watchsimulator.a" \
            -verify_arch arm64 x86_64
          lipo "${XCF}/xros-arm64/libStockfish-xros-arm64.a" -verify_arch arm64
          lipo \
            "${XCF}/xros-arm64_x86_64-simulator/libStockfish-xrsimulator.a" \
            -verify_arch arm64 x86_64
          lipo "${MAC}" -verify_arch arm64 x86_64

          minos() {
            otool -arch "$1" -l "$2" | \
              awk '$1 == "minos" { print $2 }' | sort -u
          }
          test "$(minos arm64_32 "${WATCH}")" = '6.0'
          test "$(minos arm64 "${WATCH}")" = '26.0'

          DISASSEMBLY="${RUNNER_TEMP}/swiftstockfish-x86_64.txt"
          otool -arch x86_64 -tvV "${MAC}" > "${DISASSEMBLY}"
          grep -Eq '[[:space:]](vpbroadcast|vpadd|vpmadd)' "${DISASSEMBLY}"
          grep -Eq '[[:space:]](pextq|pdepq|mulxq|bzhiq)' "${DISASSEMBLY}"
          rm -f "${DISASSEMBLY}"

      - name: Test rebuilt binary delivery path — including live engine integration
        env:
          SWIFTSTOCKFISH_INTEGRATION: '1'
        run: swift test --scratch-path "${RUNNER_TEMP}/swiftstockfish-release-binary"

      - name: Archive and verify the exact asset
        id: checksum
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            Frameworks/Stockfish.xcframework "${ASSET}"
          CHECKSUM="$(swift package compute-checksum "${ASSET}")"
          echo "checksum=${CHECKSUM}" >> "${GITHUB_OUTPUT}"

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "${VERIFY_DIR}"' EXIT
          ditto -x -k "${ASSET}" "${VERIFY_DIR}"
          diff -qr Frameworks/Stockfish.xcframework \
            "${VERIFY_DIR}/Stockfish.xcframework"

      - name: Create the final detached release commit
        id: release_commit
        env:
          CHECKSUM: ${{ steps.checksum.outputs.checksum }}
          REPO: ${{ github.repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git checkout --detach

          # A BACKFILL CARRIES THE DEFAULT BRANCH'S CI CONFIG, and must.
          #
          # The release commit is a detached artifact whose whole job is to carry
          # the URL-mode manifest; `.github/` is not part of the Swift package and
          # nothing consuming a release tag reads it. But the publish step pushes
          # this commit to a `release-prep/` branch, and GitHub refuses a push from
          # GITHUB_TOKEN that "creates or updates" a workflow file — which an old
          # tag's `.github/workflows/` does by definition once the default branch
          # has moved. `workflows` is not a grantable GITHUB_TOKEN scope, so there
          # is nothing to permit; the tree simply must not differ there.
          #
          # Taking the default branch's `.github/` makes the difference zero. It
          # is also the more honest artifact: the CI that produced this release is
          # today's, not the CI that happened to exist when the source was tagged.
          # (release backfill 2026-09-07)
          if [ -n "${SOURCE_REF}" ]; then
            git checkout "origin/${DEFAULT_BRANCH}" -- .github
          fi

          python3 .github/scripts/rewrite_binary_target.py \
            "https://github.com/${REPO}/releases/download/${VERSION}/${ASSET}" \
            "${CHECKSUM}"
          swift package dump-package >/dev/null

          git rm -rf --ignore-unmatch Frameworks/Stockfish.xcframework
          for pattern in 'Frameworks/*.xcframework' 'Stockfish.xcframework.zip'; do
            grep -qxF "${pattern}" .gitignore || printf '%s\n' "${pattern}" >> .gitignore
          done
          git add Package.swift .gitignore
          [ -n "${SOURCE_REF}" ] && git add .github
          git diff --cached --check

          # `.github/` is stageable ONLY on a backfill, for the reason above. On a
          # normal release the tree is already the default branch's, so anything
          # under it appearing here would be an unexplained difference.
          ALLOWED='^(Package.swift|\.gitignore|Frameworks/Stockfish\.xcframework/)'
          [ -n "${SOURCE_REF}" ] && ALLOWED="${ALLOWED%)}|\.github/)"
          UNEXPECTED="$(git diff --cached --name-only | \
            grep -Ev "${ALLOWED}" || true)"
          if [ -n "${UNEXPECTED}" ]; then
            echo "::error::unexpected paths staged for the release commit"
            printf '%s\n' "${UNEXPECTED}"
            exit 1
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Release ${VERSION}: host XCFramework as a release asset"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Stage, verify, and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ steps.release_commit.outputs.sha }}
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "${GH_TOKEN}" | \
            base64 | tr -d '\r\n')"
          echo "::add-mask::${AUTH_HEADER}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_HEADER}"
          export GIT_TERMINAL_PROMPT=0
          unset AUTH_HEADER

          PREP_BRANCH="release-prep/${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PREP_PUSHED=0
          RELEASE_ID=''
          PUBLISHED=0
          assert_tag_absent() {
            local status
            if git ls-remote --exit-code --tags origin \
              "refs/tags/${VERSION}" >/dev/null; then
              echo "::error::tag '${VERSION}' appeared during this release run"
              return 1
            else
              status=$?
              if [ "${status}" -ne 2 ]; then
                echo "::error::could not verify that tag '${VERSION}' is unused"
                return "${status}"
              fi
            fi
          }
          cleanup() {
            if [ "${PUBLISHED}" -eq 0 ] && [ -n "${RELEASE_ID}" ]; then
              CURRENT_RELEASE_ID="$(gh release view "${VERSION}" \
                --json databaseId --jq '.databaseId' 2>/dev/null || true)"
              RELEASE_STATE="$(gh api \
                "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
                --jq '.draft' 2>/dev/null || true)"
              if [ "${RELEASE_STATE}" = 'true' ] && \
                 [ "${CURRENT_RELEASE_ID}" = "${RELEASE_ID}" ] && \
                 [ "$(gh release view "${VERSION}" --json targetCommitish \
                    --jq '.targetCommitish' 2>/dev/null || true)" = \
                   "${RELEASE_COMMIT}" ]; then
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" >/dev/null || true
              fi
            fi
            if [ "${PREP_PUSHED}" -eq 1 ]; then
              git push \
                --force-with-lease="refs/heads/${PREP_BRANCH}:${RELEASE_COMMIT}" \
                origin ":refs/heads/${PREP_BRANCH}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          git push origin "${RELEASE_COMMIT}:refs/heads/${PREP_BRANCH}"
          PREP_PUSHED=1
          assert_tag_absent
          gh release create "${VERSION}" \
            --draft \
            --target "${RELEASE_COMMIT}" \
            --title "${VERSION}" \
            --notes "Prebuilt multi-arch Stockfish.xcframework for SwiftStockfish ${VERSION}.

          The tagged Package.swift pins this exact asset by URL and checksum. The optimized x86_64 slices require AVX2/BMI2 (Haswell-class or newer); optimized ARM slices require FEAT_DotProd. Neither path has runtime baseline dispatch."
          RELEASE_ID="$(gh release view "${VERSION}" \
            --json databaseId --jq '.databaseId')"
          test "$(gh release view "${VERSION}" --json targetCommitish \
            --jq '.targetCommitish')" = "${RELEASE_COMMIT}"
          gh release upload "${VERSION}" "${ASSET}"

          test "$(gh release view "${VERSION}" --json isDraft --jq '.isDraft')" = 'true'
          test "$(gh release view "${VERSION}" --json assets --jq \
            '.assets[] | select(.name == "Stockfish.xcframework.zip") | .name')" = "${ASSET}"

          VERIFY_ASSET_DIR="$(mktemp -d)"
          gh release download "${VERSION}" --pattern "${ASSET}" --dir "${VERIFY_ASSET_DIR}"
          cmp "${ASSET}" "${VERIFY_ASSET_DIR}/${ASSET}"
          rm -rf "${VERIFY_ASSET_DIR}"

          assert_tag_absent
          gh release edit "${VERSION}" --draft=false
          PUBLISHED=1
          test "$(gh release view "${VERSION}" --json isDraft --jq '.isDraft')" = 'false'
          test "$(git ls-remote origin "refs/tags/${VERSION}" | \
            awk 'NR == 1 { print $1 }')" = "${RELEASE_COMMIT}"
