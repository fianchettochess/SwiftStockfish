name: Release binary

# Releases are deliberately manual. The workflow starts from the current
# default-branch commit, rebuilds and tests the exact XCFramework, creates the
# URL-based manifest commit, then creates one stable semver tag through a
# draft release. It never force-moves a tag and never mutates `main`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release version / tag (for example 18.0.10)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}
  ASSET: Stockfish.xcframework.zip

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version, source revision, and collisions
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${VERSION}" | \
            grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::invalid version '${VERSION}' — expected stable N.N.N"
            exit 1
          fi
          git check-ref-format "refs/tags/${VERSION}"
          git fetch --no-tags origin "${DEFAULT_BRANCH}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${DEFAULT_BRANCH}")" ]; then
            echo "::error::dispatch this workflow from the current ${DEFAULT_BRANCH} head"
            exit 1
          fi
          assert_tag_absent() {
            local status
            if git ls-remote --exit-code --tags origin \
              "refs/tags/${VERSION}" >/dev/null; then
              echo "::error::tag '${VERSION}' already exists; release tags are never re-cut"
              return 1
            else
              status=$?
              if [ "${status}" -ne 2 ]; then
                echo "::error::could not verify that tag '${VERSION}' is unused"
                return "${status}"
              fi
            fi
          }
          assert_tag_absent
          RELEASE_TAGS="$(gh release list --limit 10000 --json tagName \
            --jq '.[].tagName')"
          if printf '%s\n' "${RELEASE_TAGS}" | grep -qxF "${VERSION}"; then
            echo "::error::release '${VERSION}' already exists"
            exit 1
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.6'

      - name: Build exact XCFramework
        run: |
          chmod +x Tools/build-xcframework.sh
          ./Tools/build-xcframework.sh

      - name: Validate architecture, deployment, and optimized Intel slices
        run: |
          set -euo pipefail
          XCF='Frameworks/Stockfish.xcframework'
          WATCH="${XCF}/watchos-arm64_arm64_32/libStockfish-watchos.a"
          MAC="${XCF}/macos-arm64_x86_64/libStockfish-macosx.a"
          plutil -lint "${XCF}/Info.plist"
          lipo -verify_arch arm64 "${XCF}/ios-arm64/libStockfish-iphoneos-arm64.a"
          lipo -verify_arch arm64 x86_64 \
            "${XCF}/ios-arm64_x86_64-simulator/libStockfish-iphonesimulator.a"
          lipo -verify_arch arm64 x86_64 \
            "${XCF}/ios-arm64_x86_64-maccatalyst/libStockfish-maccatalyst.a"
          lipo -verify_arch arm64 "${XCF}/tvos-arm64/libStockfish-appletvos-arm64.a"
          lipo -verify_arch arm64 x86_64 \
            "${XCF}/tvos-arm64_x86_64-simulator/libStockfish-appletvsimulator.a"
          lipo -verify_arch arm64_32 arm64 "${WATCH}"
          lipo -verify_arch arm64 x86_64 \
            "${XCF}/watchos-arm64_x86_64-simulator/libStockfish-watchsimulator.a"
          lipo -verify_arch arm64 "${XCF}/xros-arm64/libStockfish-xros-arm64.a"
          lipo -verify_arch arm64 x86_64 \
            "${XCF}/xros-arm64_x86_64-simulator/libStockfish-xrsimulator.a"
          lipo -verify_arch arm64 x86_64 "${MAC}"

          minos() {
            otool -arch "$1" -l "$2" | \
              awk '$1 == "minos" { print $2 }' | sort -u
          }
          test "$(minos arm64_32 "${WATCH}")" = '6.0'
          test "$(minos arm64 "${WATCH}")" = '26.0'

          DISASSEMBLY="${RUNNER_TEMP}/swiftstockfish-x86_64.txt"
          otool -arch x86_64 -tvV "${MAC}" > "${DISASSEMBLY}"
          grep -Eq '[[:space:]](vpbroadcast|vpadd|vpmadd)' "${DISASSEMBLY}"
          grep -Eq '[[:space:]](pextq|pdepq|mulxq|bzhiq)' "${DISASSEMBLY}"
          rm -f "${DISASSEMBLY}"

      - name: Test the freshly rebuilt binary
        run: swift test --scratch-path .build-release

      - name: Live Stockfish UCI integration
        env:
          SWIFTSTOCKFISH_INTEGRATION: '1'
        run: swift test --scratch-path .build-release-live

      - name: Archive and verify the exact asset
        id: checksum
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            Frameworks/Stockfish.xcframework "${ASSET}"
          CHECKSUM="$(swift package compute-checksum "${ASSET}")"
          echo "checksum=${CHECKSUM}" >> "${GITHUB_OUTPUT}"

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "${VERIFY_DIR}"' EXIT
          ditto -x -k "${ASSET}" "${VERIFY_DIR}"
          diff -qr Frameworks/Stockfish.xcframework \
            "${VERIFY_DIR}/Stockfish.xcframework"

      - name: Create the final detached release commit
        id: release_commit
        env:
          CHECKSUM: ${{ steps.checksum.outputs.checksum }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git checkout --detach
          python3 .github/scripts/rewrite_binary_target.py \
            "https://github.com/${REPO}/releases/download/${VERSION}/${ASSET}" \
            "${CHECKSUM}"
          swift package dump-package >/dev/null

          git rm -rf --ignore-unmatch Frameworks/Stockfish.xcframework
          for pattern in 'Frameworks/*.xcframework' 'Stockfish.xcframework.zip'; do
            grep -qxF "${pattern}" .gitignore || printf '%s\n' "${pattern}" >> .gitignore
          done
          git add Package.swift .gitignore
          git diff --cached --check

          UNEXPECTED="$(git diff --cached --name-only | \
            grep -Ev '^(Package.swift|\.gitignore|Frameworks/Stockfish\.xcframework/)' || true)"
          if [ -n "${UNEXPECTED}" ]; then
            echo "::error::unexpected paths staged for the release commit"
            printf '%s\n' "${UNEXPECTED}"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Release ${VERSION}: host XCFramework as a release asset"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Stage, verify, and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ steps.release_commit.outputs.sha }}
        run: |
          set -euo pipefail
          PREP_BRANCH="release-prep/${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PREP_PUSHED=0
          RELEASE_ID=''
          PUBLISHED=0
          assert_tag_absent() {
            local status
            if git ls-remote --exit-code --tags origin \
              "refs/tags/${VERSION}" >/dev/null; then
              echo "::error::tag '${VERSION}' appeared during this release run"
              return 1
            else
              status=$?
              if [ "${status}" -ne 2 ]; then
                echo "::error::could not verify that tag '${VERSION}' is unused"
                return "${status}"
              fi
            fi
          }
          cleanup() {
            if [ "${PUBLISHED}" -eq 0 ] && [ -n "${RELEASE_ID}" ]; then
              CURRENT_RELEASE_ID="$(gh release view "${VERSION}" \
                --json databaseId --jq '.databaseId' 2>/dev/null || true)"
              RELEASE_STATE="$(gh api \
                "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
                --jq '.draft' 2>/dev/null || true)"
              if [ "${RELEASE_STATE}" = 'true' ] && \
                 [ "${CURRENT_RELEASE_ID}" = "${RELEASE_ID}" ] && \
                 [ "$(gh release view "${VERSION}" --json targetCommitish \
                    --jq '.targetCommitish' 2>/dev/null || true)" = \
                   "${RELEASE_COMMIT}" ]; then
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" >/dev/null || true
              fi
            fi
            if [ "${PREP_PUSHED}" -eq 1 ]; then
              git push \
                --force-with-lease="refs/heads/${PREP_BRANCH}:${RELEASE_COMMIT}" \
                origin ":refs/heads/${PREP_BRANCH}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          git push origin "${RELEASE_COMMIT}:refs/heads/${PREP_BRANCH}"
          PREP_PUSHED=1
          assert_tag_absent
          gh release create "${VERSION}" \
            --draft \
            --target "${RELEASE_COMMIT}" \
            --title "${VERSION}" \
            --notes "Prebuilt multi-arch Stockfish.xcframework for SwiftStockfish ${VERSION}.

          The tagged Package.swift pins this exact asset by URL and checksum. The optimized x86_64 slices require AVX2/BMI2 (Haswell-class or newer); optimized ARM slices require FEAT_DotProd. Neither path has runtime baseline dispatch."
          RELEASE_ID="$(gh release view "${VERSION}" \
            --json databaseId --jq '.databaseId')"
          test "$(gh release view "${VERSION}" --json targetCommitish \
            --jq '.targetCommitish')" = "${RELEASE_COMMIT}"
          gh release upload "${VERSION}" "${ASSET}"

          test "$(gh release view "${VERSION}" --json isDraft --jq '.isDraft')" = 'true'
          test "$(gh release view "${VERSION}" --json assets --jq \
            '.assets[] | select(.name == "Stockfish.xcframework.zip") | .name')" = "${ASSET}"

          VERIFY_ASSET_DIR="$(mktemp -d)"
          gh release download "${VERSION}" --pattern "${ASSET}" --dir "${VERIFY_ASSET_DIR}"
          cmp "${ASSET}" "${VERIFY_ASSET_DIR}/${ASSET}"
          rm -rf "${VERIFY_ASSET_DIR}"

          assert_tag_absent
          gh release edit "${VERSION}" --draft=false
          PUBLISHED=1
          test "$(gh release view "${VERSION}" --json isDraft --jq '.isDraft')" = 'false'
          test "$(git ls-remote origin "refs/tags/${VERSION}" | \
            awk 'NR == 1 { print $1 }')" = "${RELEASE_COMMIT}"
