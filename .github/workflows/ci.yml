name: CI

# Build + test on both arms of the conditional manifest (see Package.swift):
#
#   * linux-x86_64 — the SOURCE arm (GitHub-hosted ubuntu-latest).
#     Compiles CStockfish from scratch with no SIMD flags (USE_SSE2 only
#     via StockfishConfig.h); guards the generic source path.  No
#     SWIFTSTOCKFISH_FORCE_SOURCE_ENGINE override is needed — linux sets
#     useBinaryEngine = false automatically.
#
#   * macos-self-hosted — the APPLE (binary) arm (self-hosted Intel Mac Pro).
#     Links the prebuilt Stockfish.xcframework committed under Frameworks/.
#     No FORCE_SOURCE override.  The xcframework's macos-arm64_x86_64 slice
#     covers x86_64 (Intel).  This trusted job enables the live engine suite;
#     its versioned cache downloads the ~107 MB NNUE fixture once and verifies
#     the nets' full pinned SHA-256 digests before each test process uses them.
#
# Runs on every push to `main`, every PR, and manual dispatch. The release
# workflow separately rebuilds the artifact and runs the live-engine suite
# before it creates the one-time release tag.
#
# Security: fork pull requests run only on GitHub-hosted Linux. The shared
# self-hosted Mac runs trusted pushes/manual dispatches and same-repository
# pull requests, never untrusted fork code.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86_64 (source build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pin the Swift 6.4 release-branch snapshot's Jammy image by its immutable
    # multi-architecture digest so the moving nightly tag cannot drift.
    container: swiftlang/swift:nightly-6.4.x-jammy@sha256:cb082661bc53e8deb8a15610396af75b71752b8f62952426b8906847e607af8c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test

  macos-self-hosted:
    name: macOS — self-hosted (Intel Mac Pro, binary arm)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The trusted runner owns its workspace; avoid copying its account's
          # global .gitconfig into the Actions log for safe-directory setup.
          set-safe-directory: false
          persist-credentials: false
      - name: Verify optimized Intel CPU features
        run: |
          FEATURES="$(sysctl -n machdep.cpu.leaf7_features)"
          grep -qw AVX2 <<< "${FEATURES}"
          grep -qw BMI2 <<< "${FEATURES}"
      - name: swift build
        run: swift build
      - name: swift test — including live engine integration
        # The job-level trust boundary above excludes fork pull requests. The
        # live suite shares one serialized, versioned NNUE fixture and reuses
        # valid cached downloads across runs on this self-hosted machine.
        env:
          SWIFTSTOCKFISH_INTEGRATION: '1'
        run: swift test
