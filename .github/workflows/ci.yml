name: CI

# Build + test on both arms of the conditional manifest (see Package.swift):
#
#   * linux-x86_64 — the SOURCE arm (GitHub-hosted ubuntu-latest).
#     Compiles CStockfish from scratch with no SIMD flags (USE_SSE2 only
#     via StockfishConfig.h); guards the generic source path.  No
#     SWIFTSTOCKFISH_FORCE_SOURCE_ENGINE override is needed — linux sets
#     useBinaryEngine = false automatically.
#
#   * macos-self-hosted — the APPLE (binary) arm (self-hosted Intel Mac Pro).
#     Links the prebuilt Stockfish.xcframework committed under Frameworks/.
#     No FORCE_SOURCE override.  The xcframework's macos-arm64_x86_64 slice
#     covers x86_64 (Intel).  The gated engine-integration suite (suite 3,
#     which needs the NNUE net files — gitignored, ~107 MB) is NOT run here;
#     it is correctly skipped when SWIFTSTOCKFISH_INTEGRATION is unset.
#
# Runs on every push to `main`, every PR, and every version tag. The live-engine
# integration suite (a ~107 MB net download + a real engine) runs ONLY on tagged
# releases, on the self-hosted runner — see the macOS job below — so a plain PR
# stays fast.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - '*.*.*'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    name: Linux x86_64 (source build)
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test

  macos-self-hosted:
    name: macOS — self-hosted (Intel Mac Pro, binary arm)
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        run: swift build
      - name: swift test
        # Suite 1 (logic) and Suite 2 (filesystem) run unconditionally.
        # Suite 3 (live engine integration) stays skipped here — it needs
        # SWIFTSTOCKFISH_INTEGRATION set (see the tagged-release step below).
        run: swift test
      - name: swift test — live engine integration (tagged releases only)
        # On a version tag, run the full suite including Suite 3: it downloads
        # the real nets via StockfishNetworkLoader.ensure(in:) and drives a live
        # engine. Confined to tags so PRs/pushes don't pay the 107 MB download.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SWIFTSTOCKFISH_INTEGRATION: '1'
        run: swift test
